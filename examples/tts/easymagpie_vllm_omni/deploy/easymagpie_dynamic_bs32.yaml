# B32 profile with a low-latency first codec packet and dynamic later packets.
# The matching model directory must contain a 32-model-frame codec export.
pipeline: easymagpie
async_chunk: true

trust_remote_code: true
dtype: float16

connectors:
  connector_of_shared_memory:
    # Retain acoustic code windows on GPU across the local Stage-0 -> Stage-1
    # process boundary. Control metadata still uses POSIX shared memory.
    name: EasyMagpieCudaIpcConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      cuda_ipc_lease_seconds: 30
      # Stage 0 still publishes cheap three-frame source deltas.  Stage 1
      # drains every delta accumulated during the bounded post-first interval.
      codec_chunk_frames: 3
      codec_left_context_frames: 12
      initial_codec_chunk_frames: 1
      # A 32-frame artifact leaves room for 20 new frames after the 12-frame
      # overlap.  A 50 ms interval preserves some post-first coalescing while
      # avoiding the 250 ms per-drain latency penalty seen in B32 profiling.
      codec_fixed_chunk_frames: 32
      codec_dynamic_chunking: true
      codec_dynamic_chunk_wait_us: 50000
      codec_microbatch_wait_us: 1500
      codec_microbatch_parallelism: 32
      decode_cudagraph_capture_frames: [32]
      decode_cudagraph_batch_sizes: [1, 2, 4, 8, 16, 32]

stages:
  - stage_id: 0
    max_num_seqs: 32
    gpu_memory_utilization: 0.5
    enforce_eager: false
    async_scheduling: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    max_num_batched_tokens: 8192
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    mamba_ssm_cache_dtype: float32
    skip_tokenizer_init: true
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieGPUARWorker
    default_sampling_params:
      temperature: 0.0
      detokenize: false
      max_tokens: 2048

  - stage_id: 1
    max_num_seqs: 32
    gpu_memory_utilization: 0.35
    enforce_eager: true
    async_scheduling: false
    enable_prefix_caching: false
    # 32 requests × 16 codebooks × 32 frames = 16,384 codec ids.
    max_num_batched_tokens: 17408
    max_model_len: 1024
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
