# Best validated zero-underrun native EasyMagpie configuration on RTX A4500.
# This file is a reproducibility manifest; the referenced deploy YAML remains
# the configuration consumed by vLLM-Omni.
profile: easymagpie_native_best_zero_underrun_bs16
saved_at: "2026-07-28"
hardware: NVIDIA RTX A4500
image: easymp-vllm-omni:0.24-native
service_port: 8091

launcher: ../scripts/run_server_native_optimized_bs16.sh
cache_environment: ../scripts/setenv.sh
deploy_config: easymagpie_native_optimized_bs16.yaml
moe_config: ../moe_configs_a4500/E=24,N=768,device_name=NVIDIA_RTX_A4500.json

