# Isolated H100 scaling profile with matched 64-request capacity.
pipeline: easymagpie
async_chunk: true
trust_remote_code: true
dtype: float16

connectors:
  connector_of_shared_memory:
    name: EasyMagpieCudaIpcConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      cuda_ipc_lease_seconds: 30
      cuda_ipc_clone_payload: false
      cuda_ipc_notify_fallback_ms: 20
      # Provide 640 ms of initial audio so the B64 service absorbs the
      # observed 541.5 ms steady-gap outlier without a playout underrun.
      codec_startup_chunk_frames: [16]
      codec_chunk_frames: 12
      codec_dynamic_chunking: true
      codec_dynamic_chunk_wait_us: 5000
      codec_dynamic_wait_only_underfilled: true
      # Keep every B64 codec schedule at the six-frame source cadence. Larger
      # drain capacity merged queued successors into multi-second per-request
      # windows, producing head-of-line stalls despite high aggregate RTFX.
      codec_fixed_chunk_frames: 12
      codec_microbatch_wait_us: 1500
      codec_microbatch_parallelism: 64
      codec_microbatch_max_batch_size: 64

stages:
  - stage_id: 0
    max_num_seqs: 64
    gpu_memory_utilization: 0.5
    enforce_eager: false
    async_scheduling: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    mamba_ssm_cache_dtype: float32
    skip_tokenizer_init: true
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieGPUARWorker
    default_sampling_params:
      temperature: 0.0
      detokenize: false
      max_tokens: 2048

  - stage_id: 1
    max_num_seqs: 64
    gpu_memory_utilization: 0.35
    dtype: float32
    enforce_eager: true
    async_scheduling: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    max_num_batched_tokens: 512
    max_model_len: 512
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieCodecGPUWorker
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
