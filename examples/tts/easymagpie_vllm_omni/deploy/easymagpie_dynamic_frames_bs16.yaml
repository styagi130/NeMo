# BS16 in-process TensorRT codec profile.
#
# The first acoustic packet remains one frame for TTFA.  Afterwards Stage 1
# waits briefly, drains every contiguous codec window already present for each
# request, and sends the resulting variable-size rows to the dynamic TensorRT
# plan.  ``codec_fixed_chunk_frames`` is a *merge capacity*, not a padding
# size: Code2Wav detects the dynamic plan and executes the real frame length.
pipeline: easymagpie
async_chunk: true

trust_remote_code: true
dtype: float16

connectors:
  connector_of_shared_memory:
    # Control metadata stays in POSIX SHM; ``codes.audio`` uses CUDA IPC so
    # Stage 0 does not materialize every acoustic frame on the CPU.
    name: EasyMagpieCudaIpcConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      cuda_ipc_lease_seconds: 30
      # Keep the one-frame initial packet for TTFA, then publish six new
      # frames per transfer window.  Dynamic Stage-1 draining can still merge
      # several windows to the 200-frame TensorRT capacity, while this halves
      # Stage-0 SHM/IPC notifications and lock acquisitions.
      codec_chunk_frames: 6
      codec_left_context_frames: 12
      initial_codec_chunk_frames: 1
      codec_dynamic_chunking: true
      codec_dynamic_chunk_wait_us: 100000
      # A saturated B16 cohort is already the desired TensorRT batch. Do not
      # hold it behind the underfilled-cohort deadline.
      codec_dynamic_wait_only_underfilled: true
      codec_fixed_chunk_frames: 200
      # Stage 0 now owns stable ring-buffer allocations until the CUDA-IPC
      # receiver acknowledges them, so the connector need not clone payloads.
      cuda_ipc_clone_payload: false
      # Stage 0 signals this Unix-domain event after publishing a SHM key;
      # Stage 1 blocks on it instead of issuing failed shm_open polls.  The
      # timeout is only a recovery path for startup/cancellation races.
      cuda_ipc_notify_fallback_ms: 20
      codec_microbatch_wait_us: 1500
      codec_microbatch_parallelism: 16

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.5
    enforce_eager: false
    async_scheduling: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    mamba_ssm_cache_dtype: float32
    skip_tokenizer_init: true
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieGPUARWorker
    default_sampling_params:
      temperature: 0.0
      detokenize: false
      max_tokens: 2048

  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.35
    enforce_eager: true
    async_scheduling: false
    enable_prefix_caching: false
    max_num_batched_tokens: 4096
    max_model_len: 512
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
