# Native vLLM codec, B16 optimized streaming profile.
#
# Stage 0 and the stateful native codec are separate vLLM processes on one GPU.
# CUDA IPC removes the per-window GPU->CPU->GPU transfer; it does not replace
# the codec with a TensorRT plan or start a Triton codec backend.
pipeline: easymagpie
async_chunk: true
trust_remote_code: true
dtype: float16

connectors:
  connector_of_shared_memory:
    # Same-GPU native transport: only the small acoustic-code leaf uses CUDA
    # IPC; all control metadata remains on the stock shared-memory channel.
    name: EasyMagpieCudaIpcConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      cuda_ipc_lease_seconds: 30
      cuda_ipc_clone_payload: false
      cuda_ipc_notify_fallback_ms: 20

      # Two startup frames provide 160 ms of audio, covering the measured
      # 142-153 ms first-to-second packet gap without changing steady packets.
      codec_startup_chunk_frames: [2]
      codec_chunk_frames: 6
      codec_dynamic_chunking: true
      codec_dynamic_chunk_wait_us: 5000
      codec_dynamic_wait_only_underfilled: true
      codec_fixed_chunk_frames: 200

      # Coalesce one Stage-0 AR cohort before sending it to Stage 1.  The wait
      # is bounded and per-stream order remains unchanged.
      codec_microbatch_wait_us: 1500
      codec_microbatch_parallelism: 16
      codec_microbatch_max_batch_size: 16

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.5
    enforce_eager: false
    async_scheduling: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    mamba_ssm_cache_dtype: float32
    skip_tokenizer_init: true
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieGPUARWorker
    default_sampling_params:
      temperature: 0.0
      detokenize: false
      max_tokens: 2048

  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.35
    # FP32 remains required for artifact-free native spectral decoding.
    dtype: float32
    enforce_eager: true
    async_scheduling: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    max_num_batched_tokens: 512
    max_model_len: 512
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieCodecGPUWorker
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
