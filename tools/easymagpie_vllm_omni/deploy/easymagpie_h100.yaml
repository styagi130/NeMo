# Optional single-H100 profile: two 64-request LMs and one 128-request codec.
pipeline: easymagpie
async_chunk: true
trust_remote_code: true
dtype: float16

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 8
      codec_startup_chunk_frames: [2, 2, 2, 4]
      codec_busy_startup_chunk_frames: [4, 4, 4, 8]
      stage0_admission_coalesce_ms: 50
      codec_startup_coalesce_ms: 2
      codec_busy_coalesce_ms: 4

stages:
  - stage_id: 0
    num_replicas: 2
    max_num_seqs: 64
    gpu_memory_utilization: 0.18
    kv_cache_memory_bytes: 2147483648
    enforce_eager: false
    async_scheduling: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0,0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    mamba_ssm_cache_dtype: float32
    skip_tokenizer_init: true
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieGPUARWorker
      compilation_config:
        max_cudagraph_capture_size: 4096
        cudagraph_capture_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 128, 256, 512, 1024, 2048, 4096]
    default_sampling_params:
      temperature: 0.0
      detokenize: false
      max_tokens: 2048

  - stage_id: 1
    num_replicas: 1
    max_num_seqs: 128
    gpu_memory_utilization: 0.04
    kv_cache_memory_bytes: 268435456
    dtype: float32
    enforce_eager: true
    async_scheduling: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    # Cover the LM's 4096-token context plus one terminal codec chunk.
    max_num_batched_tokens: 4104
    max_model_len: 4104
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieCodecGPUGenerationWorker
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
