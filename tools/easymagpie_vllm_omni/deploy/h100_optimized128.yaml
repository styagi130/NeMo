# Opt-in H100 profile: run with scripts/run_optimized_server.sh.
# Capacity 128; codec graphs cover batch sizes 1..64, with eager fallback above 64.
pipeline: easymagpie
async_chunk: true
trust_remote_code: true
dtype: float16
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 8
      codec_startup_chunk_frames:
      - 2
      - 6
stages:
- stage_id: 0
  num_replicas: 1
  max_num_seqs: 128
  gpu_memory_utilization: 0.36
  kv_cache_memory_bytes: 4294967296
  enforce_eager: false
  async_scheduling: true
  enable_prefix_caching: false
  enable_chunked_prefill: true
  max_num_batched_tokens: 4096
  max_model_len: 4096
  devices: '0'
  output_connectors:
    to_stage_1: connector_of_shared_memory
  mamba_ssm_cache_dtype: float32
  skip_tokenizer_init: true
  engine_extras:
    worker_cls: easymagpie_vllm_omni.optimized_workers.H100OptimizedTalkerWorker
    compilation_config:
      max_cudagraph_capture_size: 4096
      cudagraph_capture_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 24
      - 32
      - 40
      - 48
      - 56
      - 64
      - 80
      - 96
      - 112
      - 128
      - 192
      - 256
      - 384
      - 512
      - 768
      - 1024
      - 1536
      - 2048
      - 3072
      - 4096
  default_sampling_params:
    temperature: 0.0
    detokenize: false
    max_tokens: 2048
- stage_id: 1
  num_replicas: 1
  max_num_seqs: 128
  gpu_memory_utilization: 0.04
  kv_cache_memory_bytes: 268435456
  dtype: float32
  enforce_eager: true
  async_scheduling: true
  enable_prefix_caching: false
  enable_chunked_prefill: false
  max_num_batched_tokens: 4104
  max_model_len: 4104
  devices: '0'
  input_connectors:
    from_stage_0: connector_of_shared_memory
  engine_extras:
    worker_cls: easymagpie_vllm_omni.optimized_workers.H100OptimizedCodecWorker
    scheduler_cls: easymagpie_vllm_omni.scheduler.EasyMagpieAsyncCodecScheduler
  default_sampling_params:
    temperature: 0.0
    max_tokens: 65536
